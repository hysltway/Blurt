<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Blurt 设置</title>
<link rel="stylesheet" href="settings.css" />
</head>
<body>
<header class="app-header">
  <div class="brand">
    <h1>Blurt</h1>
    <div class="engine-pill" id="enginePill" title="识别状态" role="status" aria-live="polite">
      <span class="dot missing" id="pillDot"></span><span id="pillText">检查中…</span><span class="pill-reason" id="pillReason" hidden></span>
    </div>
  </div>
  <button class="btn header-action" id="btnOpenLogs" type="button">日志目录</button>
</header>

<main class="page-shell">
  <section class="settings-panel" aria-label="设置">
    <div class="primary-settings">
      <section class="settings-section" aria-labelledby="inputHeading">
        <h2 id="inputHeading">输入</h2>
        <div class="setting-row">
          <label for="btnCaptureHotkey">快捷键</label>
          <div class="shortcut-editor">
            <output class="keycaps" id="hotkeyValue" aria-live="polite"></output>
            <button class="btn" id="btnCaptureHotkey" type="button">修改</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="field-label">写入方式</div>
          <div class="seg" id="injectSeg" role="radiogroup" aria-label="文本写入方式">
            <label><input type="radio" name="injectMode" value="auto" /><span>智能</span></label>
            <label><input type="radio" name="injectMode" value="type" /><span>键入</span></label>
            <label><input type="radio" name="injectMode" value="paste" /><span>粘贴</span></label>
          </div>
        </div>
        <div class="setting-row">
          <label for="autostart">开机自启</label>
          <div class="setting-control">
            <div class="switch">
              <input type="checkbox" id="autostart" aria-label="开机自启" />
              <label class="slider" for="autostart"></label>
            </div>
          </div>
        </div>
      </section>

      <section class="settings-section" aria-labelledby="recognitionHeading">
        <h2 id="recognitionHeading">识别</h2>
        <div class="setting-row">
          <label for="micDevice">麦克风</label>
          <select id="micDevice"><option value="">系统默认</option></select>
        </div>
        <div class="setting-row">
          <label for="autoStop">静音结束录音</label>
          <div class="range-wrap">
            <input type="range" id="autoStop" min="0" max="6" step="0.25" />
            <span class="val" id="autoStopVal">2 秒</span>
          </div>
        </div>
        <div class="setting-row">
          <label for="maxRecord">最长录音</label>
          <div class="range-wrap">
            <input type="range" id="maxRecord" min="15" max="180" step="15" />
            <span class="val" id="maxRecordVal">120 秒</span>
          </div>
        </div>
        <div class="setting-row" id="voiceprintRow">
          <div class="field-label">声纹防干扰</div>
          <div class="setting-control vp-setting-control">
            <span class="active-key-badge vp-badge" id="voiceprintBadge" title="专属声纹状态">未录制</span>
            <button class="btn btn-sm" id="btnOpenVoiceprintModal" type="button">管理</button>
            <div class="switch">
              <input type="checkbox" id="voiceprintEnabled" aria-label="专属声纹防干扰" />
              <label class="slider" for="voiceprintEnabled"></label>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="secondary-settings" aria-labelledby="serviceHeading">
      <h2 id="serviceHeading">服务</h2>
      <div class="setting-row">
        <label for="hotwords">热词</label>
        <textarea id="hotwords" rows="2" placeholder="Claude, Tauri, Rust, cloud=>claude" spellcheck="false"></textarea>
      </div>
      <div class="setting-row">
        <div class="field-label">API 密钥</div>
        <div class="setting-control api-setting-control">
          <span class="active-key-badge" id="activeKeyBadge" title="当前使用的 API Key">未配置</span>
          <button class="btn" id="btnOpenApiKeyModal" type="button">管理密钥</button>
        </div>
      </div>
    </div>
  </section>

  <section class="usage-overview" aria-label="使用统计">
    <div class="metric-grid">
      <article class="metric-card metric-duration">
        <span class="metric-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect width="6" height="12" x="9" y="2" rx="3"></rect>
            <path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"></path>
          </svg>
        </span>
        <div class="metric-copy">
          <span class="metric-label">累计记录</span>
          <strong id="metricDuration">0 分钟</strong>
        </div>
      </article>
      <article class="metric-card metric-characters">
        <span class="metric-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7V4h16v3M9 20h6M12 4v16"></path>
          </svg>
        </span>
        <div class="metric-copy">
          <span class="metric-label">累计文字</span>
          <strong id="metricCharacters">0 字</strong>
        </div>
      </article>
      <article class="metric-card metric-saved">
        <span class="metric-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2"></path>
          </svg>
        </span>
        <div class="metric-copy">
          <span class="metric-label">节省输入</span>
          <strong id="metricSaved">约 0 分钟</strong>
        </div>
      </article>
      <article class="metric-card metric-streak">
        <span class="metric-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2v3M16 2v3M3 9h18"></path>
            <rect width="18" height="18" x="3" y="4" rx="2"></rect>
            <path d="m9 15 2 2 4-4"></path>
          </svg>
        </span>
        <div class="metric-copy">
          <span class="metric-label">连续使用</span>
          <strong id="metricStreak">0 天</strong>
        </div>
      </article>
    </div>

    <div class="chart-grid">
      <figure class="chart-panel">
        <figcaption>
          <span>最近 30 天识别时长趋势</span>
          <span class="chart-total" id="trendTotal">共 0 分钟</span>
        </figcaption>
        <div class="chart-stage" id="trendStage">
          <svg id="durationChart" viewBox="0 0 620 190" role="img" aria-label="最近 30 天识别时长趋势"></svg>
          <div class="chart-tooltip" id="chartTooltip" hidden></div>
          <p class="chart-empty" id="trendEmpty">完成一次识别后，这里会出现趋势</p>
        </div>
      </figure>

      <figure class="chart-panel heatmap-panel">
        <figcaption>
          <span>使用热力图</span>
          <span class="chart-total" id="heatmapTotal">0 个活跃日</span>
        </figcaption>
        <div class="heatmap-layout">
          <div class="weekday-labels" aria-hidden="true">
            <span>一</span><span>三</span><span>五</span>
          </div>
          <div class="heatmap" id="usageHeatmap" role="img" aria-label="最近 30 天使用热力图"></div>
        </div>
        <div class="heatmap-footer">
          <span id="heatmapRange">最近 30 天</span>
          <div class="heatmap-legend" aria-label="使用强度：少到多">
            <span>少</span><i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i><span>多</span>
          </div>
        </div>
      </figure>
    </div>
  </section>
</main>

<!-- API 密钥管理二级弹窗 (In-page Modal) -->
<div class="modal-backdrop" id="apiKeyModal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="apiKeyModalTitle">
  <div class="modal-card" role="document">
    <header class="modal-header">
      <h3 id="apiKeyModalTitle">API 密钥</h3>
      <button class="btn-icon" id="btnCloseApiKeyModal" type="button" aria-label="关闭弹窗">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <div class="modal-body">
      <!-- 密钥列表 -->
      <section class="modal-section key-list-section">
        <div class="api-key-list" id="apiKeyList" role="list">
          <!-- 动态渲染密钥项 -->
        </div>
      </section>

      <!-- 添加密钥表单（点击右下方加号展开） -->
      <section class="modal-section add-key-section" id="addKeySection" hidden>
        <div class="key-form-grid">
          <div class="form-field">
            <label for="newKeyName">名称</label>
            <input id="newKeyName" type="text" placeholder="例如：默认、工作、测试" maxlength="24" />
          </div>
          <div class="form-field">
            <label for="newKeyValue">密钥</label>
            <input id="newKeyValue" type="password" placeholder="输入 API Key" autocomplete="off" />
          </div>
          <div class="form-action-row">
            <button class="btn btn-sm" id="btnCancelAddKey" type="button">取消</button>
            <button class="btn btn-sm primary" id="btnAddApiKey" type="button">保存</button>
          </div>
        </div>
      </section>

      <!-- 右下方添加操作 -->
      <div class="modal-bottom-actions">
        <button class="btn-icon btn-add-key" id="btnToggleAddKey" type="button" aria-label="添加密钥" title="添加新密钥">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 专属声纹录制与参数二级弹窗 (In-page Modal) -->
<div class="modal-backdrop" id="voiceprintModal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="voiceprintModalTitle">
  <div class="modal-card voiceprint-modal-card" role="document">
    <header class="modal-header">
      <h3 id="voiceprintModalTitle">专属声纹与防干扰</h3>
      <button class="btn-icon" id="btnCloseVoiceprintModal" type="button" aria-label="关闭弹窗">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <div class="modal-body voiceprint-modal-body">
      <div class="vp-prompt-box">
        <p class="vp-prompt-text" id="vpPromptText">
          “你好 Blurt，这是我的专属声纹。通过语音输入释放双手，中英混合随心表达。无论在安静工位还是团队讨论中，都能精准锁定我的声音，随时记录代码与灵感。”
        </p>
      </div>

      <div class="vp-recording-stage">
        <div class="vp-visualizer-wrap">
          <canvas id="vpWaveCanvas" class="vp-canvas" width="340" height="36"></canvas>
        </div>
        <div class="vp-progress-bar-wrap" id="vpProgressWrap" hidden>
          <div class="vp-progress-bar" id="vpProgressBar"></div>
        </div>
        <div class="vp-status-row">
          <div class="vp-status-indicator">
            <span class="dot" id="vpStatusDot"></span>
            <span class="vp-status-text" id="vpStatusText">准备就绪</span>
            <span class="vp-timer" id="vpTimer" hidden>10.0s</span>
          </div>
          <div class="vp-record-actions">
            <button class="btn btn-sm primary" id="btnRecordVoiceprint" type="button">开始录音</button>
            <button class="btn btn-sm" id="btnRerecordVoiceprint" type="button" hidden>重新录制</button>
            <button class="btn btn-sm primary" id="btnSaveVoiceprint" type="button" hidden>保存声纹</button>
          </div>
        </div>
      </div>

      <div class="vp-threshold-section">
        <div class="vp-threshold-header">
          <label for="voiceprintThreshold">识别门限</label>
          <span class="val" id="voiceprintThresholdVal">0.30</span>
        </div>
        <div class="range-wrap vp-range-wrap">
          <input type="range" id="voiceprintThreshold" min="0.15" max="0.45" step="0.01" value="0.30" />
        </div>
        <div class="vp-threshold-legend">
          <span>宽松 0.22</span>
          <span>推荐 0.30</span>
          <span>严苛 0.38</span>
        </div>
      </div>

      <div class="vp-modal-footer">
        <button class="btn btn-sm btn-delete-vp" id="btnDeleteVoiceprint" type="button" hidden>清除声纹</button>
        <div class="vp-modal-footer-right">
          <button class="btn primary" id="btnDoneVoiceprintModal" type="button">完成</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="settings.js"></script>
</body>
</html>
