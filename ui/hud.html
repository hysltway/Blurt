<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:," />
<title>Blurt HUD</title>
<style>
  :root {
    --hud-surface: #213A3D;
    --hud-text: #F4FBF7;
    --hud-line: #BBDAD5;
    --hud-danger: #A94B59;
    --hud-danger-subtle: #F6E6E9;
    --hud-focus: #2E646B;
    --hud-shadow: rgba(45, 99, 91, 0.08);
  }

  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%; height: 100%;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  canvas { display: block; }
  /* 取消按钮：简约、半透明磨砂质感、悬停微交互 */
  #closeBtn {
    position: absolute;
    right: 14px; top: 12px;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: rgba(255, 255, 255, 0.65);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    padding: 0;
    margin: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.85);
    pointer-events: none;
    transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                background-color 0.15s ease,
                border-color 0.15s ease,
                color 0.15s ease,
                box-shadow 0.15s ease;
  }
  #closeBtn svg {
    width: 10px;
    height: 10px;
    display: block;
  }
  #closeBtn.show {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  #closeBtn:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.28);
    color: rgba(255, 255, 255, 0.95);
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.22);
    transform: scale(1.06);
  }
  #closeBtn:active {
    transform: scale(0.94);
    background: rgba(255, 255, 255, 0.14);
  }

  #closeBtn:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.35); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    #closeBtn { transition-duration: 1ms; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="closeBtn" type="button" title="取消（Esc）" aria-label="取消录音或识别">
  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <line x1="4.5" y1="4.5" x2="11.5" y2="11.5"></line>
    <line x1="11.5" y1="4.5" x2="4.5" y2="11.5"></line>
  </svg>
</button>
<script src="hud.js"></script>
</body>
</html>
