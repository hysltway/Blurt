<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:," />
<title>Blurt HUD</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%; height: 100%;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  canvas { display: block; }
  /* 取消按钮：光标移入 HUD 时浮现（窗口右上角，深色小圆钮） */
  #closeBtn {
    position: absolute;
    left: 330px; top: 8px;       /* 窗口右上角 */
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(148,163,255,0.28);
    background: rgba(24,30,54,0.96);
    color: #aab4d4;
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    font: 600 12px/20px "Segoe UI", system-ui, sans-serif;
    text-align: center;
    padding: 0;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.7);
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s, background 0.15s, color 0.15s;
  }
  #closeBtn.show {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  #closeBtn:hover {
    background: #dc2626;
    color: #fff;
    border-color: #dc2626;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="closeBtn" title="取消（Esc）">✕</button>
<script src="hud.js"></script>
</body>
</html>
