<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:," />
<title>Blurt HUD</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%; height: 100%;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  canvas { display: block; }
  /* 取消按钮：光标移入 HUD 时浮现 */
  #closeBtn {
    position: absolute;
    left: 328px; top: 8px;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid #d9d8d3;
    background: #2f3437;
    color: #f7f6f3;
    font: 600 14px/21px "Bahnschrift", "Microsoft YaHei UI", sans-serif;
    text-align: center;
    padding: 0;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.7);
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s, background-color 0.15s, color 0.15s;
  }
  #closeBtn.show {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  #closeBtn:hover {
    background: #9f2f2d;
    color: #fdebec;
    border-color: #9f2f2d;
  }

  #closeBtn:focus-visible { outline: 2px solid #1f6c9f; outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    #closeBtn { transition-duration: 1ms; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="closeBtn" type="button" title="取消（Esc）" aria-label="取消录音或识别">×</button>
<script src="hud.js"></script>
</body>
</html>
