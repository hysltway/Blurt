<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:," />
<title>Blurt HUD</title>
<style>
  :root {
    --hud-surface: #33281E;
    --hud-text: #FFF7EB;
    --hud-line: #D9C5A8;
    --hud-danger: #A83D2D;
    --hud-danger-subtle: #F8E4DA;
    --hud-focus: #D97706;
    --hud-shadow: rgba(120, 80, 40, 0.08);
  }

  html, body {
    margin: 0; padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%; height: 100%;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  canvas { display: block; }
  /* 取消按钮：光标移入 HUD 时浮现 */
  #closeBtn {
    position: absolute;
    left: 328px; top: 8px;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 1px solid var(--hud-line);
    background: var(--hud-surface);
    color: var(--hud-text);
    box-shadow: 0 1px 2px var(--hud-shadow), 0 0 0 1px var(--hud-shadow);
    font: 600 14px/21px "Bahnschrift", "Microsoft YaHei UI", sans-serif;
    text-align: center;
    padding: 0;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.7);
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s, background-color 0.15s, color 0.15s;
  }
  #closeBtn.show {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  #closeBtn:hover {
    background: var(--hud-danger);
    color: var(--hud-danger-subtle);
    border-color: var(--hud-danger);
  }

  #closeBtn:focus-visible { outline: 2px solid var(--hud-focus); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    #closeBtn { transition-duration: 1ms; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="closeBtn" type="button" title="取消（Esc）" aria-label="取消录音或识别">×</button>
<script src="hud.js"></script>
</body>
</html>
